[project]
name = "triconsensus-ai"
version = "0.1.0"
description = "Fail-closed multi-agent crypto paper-trading research system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "polars>=1.20,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "lightgbm>=4.5,<5",
  "xgboost>=3,<4",
  "catboost>=1.2,<2",
  "optuna>=4,<5",
  "langgraph>=1.2.16,<2",
  "supabase>=2.13,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2"
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
