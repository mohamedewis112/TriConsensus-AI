name: Train ML V2 Economic Evidence

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Completed Bybit archive days"
        required: true
        default: "14"
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "ml-trigger/v2.txt"
permissions:
  contents: read

jobs:
  train-v2:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve days
        id: config
        shell: bash
        run: |
          DAYS="${{ inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS="14"; fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"

      - name: Install V2 research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install             "httpx>=0.28,<1"             "pydantic>=2.10,<3"             "pydantic-settings>=2.7,<3"             "numpy>=2.1,<3"             "pandas>=2.2,<4"             "scikit-learn>=1.6,<2"             "lightgbm>=4.5,<5"             "xgboost>=3,<4"             "catboost>=1.2,<2"

      - name: Run purged nested walk-forward V2
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.training_v2             --symbol "${{ matrix.symbol }}"             --days "${{ steps.config.outputs.days }}"             --output-dir "artifacts-v2/${{ matrix.symbol }}"

      - uses: actions/upload-artifact@v4
        with:
          name: "triconsensus-ml-v2-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "artifacts-v2/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
