name: Replicate ML V2 on Disjoint Window

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Completed Bybit archive days"
        required: true
        default: "30"
      end_date:
        description: "Archive end date (YYYY-MM-DD)"
        required: true
        default: "2026-10-11"

permissions:
  contents: read

jobs:
  replicate:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V2 research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.28,<1" "pydantic>=2.10,<3" "pydantic-settings>=2.7,<3" "numpy>=2.1,<3" "pandas>=2.2,<4" "scikit-learn>=1.6,<2" "lightgbm>=4.5,<5" "xgboost>=3,<4" "catboost>=1.2,<2"
      - name: Replicate unchanged V2 methodology
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.training_v2             --symbol "${{ matrix.symbol }}"             --days "${{ inputs.days }}"             --end-date "${{ inputs.end_date }}"             --output-dir "replication/${{ matrix.symbol }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "triconsensus-v2-replication-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "replication/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
