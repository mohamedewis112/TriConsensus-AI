name: V8.8 CHRONOS Real Shadow

on:
  workflow_dispatch:
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "research-trigger/v88-real-shadow.txt"
      - "backend/triconsensus/chronos_real_shadow.py"
      - ".github/workflows/v88-chronos-real-shadow.yml"

permissions:
  contents: read

jobs:
  real-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      SUPABASE_URL: https://mhrrbnufkiveynbasyiy.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed if backend credential is unavailable
        shell: bash
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "MISSING_BACKEND_CREDENTIAL: configure SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY"
            exit 42
          fi
      - name: Install real-shadow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verify real-shadow helper
        run: pytest -q tests/test_chronos_real_shadow.py
      - name: Train and evaluate CHRONOS on real V6 evidence
        run: python -m triconsensus.chronos_real_shadow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v88-real-shadow
          path: artifacts/chronos-v88-real-shadow.json
          if-no-files-found: ignore
          retention-days: 14
