name: V8.3 CHRONOS Real Replay CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_replay.py"
      - "tests/test_chronos_replay.py"
      - ".github/workflows/v83-chronos-replay-ci.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-replay-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install replay test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9" "httpx>=0.28,<1" "supabase>=2.13,<3" "pydantic-settings>=2.7,<3"
      - name: Test real V6-to-V8 replay builder
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_replay.py
