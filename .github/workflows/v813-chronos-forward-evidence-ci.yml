name: V8.13 CHRONOS Forward Evidence Auditor CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_forward_evidence.py"
      - "tests/test_chronos_forward_evidence.py"
      - ".github/workflows/v813-chronos-forward-evidence-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_forward_evidence.py"
      - "tests/test_chronos_forward_evidence.py"

jobs:
  evidence-auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test base-rate and independence-aware evidence gates
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_forward_evidence.py
