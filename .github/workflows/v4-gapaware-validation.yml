name: V4 Gap-Aware Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
        window:
          - name: historical_2024
            days: 300
            end_date: "2024-11-30"
          - name: recent_2026
            days: 90
            end_date: "2026-08-11"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install             "httpx>=0.28,<1"             "pydantic>=2.10,<3"             "pydantic-settings>=2.7,<3"             "numpy>=2.1,<3"             "pandas>=2.2,<4"
      - name: Run gap-aware regime discovery
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.regime_research             --symbol "${{ matrix.symbol }}"             --days "${{ matrix.window.days }}"             --end-date "${{ matrix.window.end_date }}"             --output-dir "v4-validation/${{ matrix.window.name }}/${{ matrix.symbol }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "v4-${{ matrix.window.name }}-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "v4-validation/${{ matrix.window.name }}/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
