name: V8.9 CHRONOS Public Live Shadow

on:
  workflow_dispatch:
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "research-trigger/v89-public-live.txt"
      - "backend/triconsensus/chronos_public_live.py"
      - ".github/workflows/v89-chronos-public-live.yml"

permissions:
  contents: read

jobs:
  public-live-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt "pytest>=8.3,<9"
      - name: Verify public-live analyzer
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_public_live.py
      - name: Collect live public L2 and run 100K-world CHRONOS
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_public_live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v89-public-live-shadow
          path: artifacts/chronos-v89-public-live-shadow.json
          if-no-files-found: ignore
          retention-days: 14
