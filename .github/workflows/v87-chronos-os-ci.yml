name: V8.7 CHRONOS Research OS CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_os.py"
      - "tests/test_chronos_os.py"
      - ".github/workflows/v87-chronos-os-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_os.py"
      - "tests/test_chronos_os.py"

jobs:
  research-os:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test integrated research operating system
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_os.py
