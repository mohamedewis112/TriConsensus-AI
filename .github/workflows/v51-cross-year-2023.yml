name: V5.1 Cross Year 2023 Replication

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research-trigger/v51-cross-year-2023.txt"

permissions:
  contents: read

jobs:
  replicate:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V5.1 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.28,<1" "pydantic>=2.10,<3" "pydantic-settings>=2.7,<3" "numpy>=2.1,<3" "pandas>=2.2,<4"
      - name: Run chronological cross-year replication
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.v51_rule_gate             --symbol "${{ matrix.symbol }}"             --calibration-days 180             --calibration-end-date 2023-08-31             --test-days 60             --test-end-date 2023-11-30             --output-dir "v51-2023/${{ matrix.symbol }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "triconsensus-v51-2023-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "v51-2023/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
