name: V8 CHRONOS 100K Multiverse Smoke

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_nervous_system.py"
      - "backend/triconsensus/chronos_smoke.py"
      - "tests/test_chronos_nervous_system.py"
      - ".github/workflows/v8-chronos-100k-smoke.yml"

jobs:
  multiverse-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test V6-to-V8 nervous-system adapter
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_nervous_system.py
      - name: Run 100,000-universe CHRONOS smoke
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.chronos_smoke --universes 100000 --horizon-steps 12 --seed 2700
