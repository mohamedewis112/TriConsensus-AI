name: V4.1 Modern Archive Replication

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research-trigger/v41-modern-archive.txt"

permissions:
  contents: read

jobs:
  replicate:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V4.1 research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install             "httpx>=0.28,<1"             "pydantic>=2.10,<3"             "pydantic-settings>=2.7,<3"             "numpy>=2.1,<3"             "pandas>=2.2,<4"
      - name: Run frozen V4.1 on disjoint public archive window
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.setup_regime_research             --symbol "${{ matrix.symbol }}"             --days 90             --end-date 2026-08-11             --source archive             --output-dir "v41-modern-archive/${{ matrix.symbol }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "triconsensus-v41-modern-archive-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "v41-modern-archive/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
