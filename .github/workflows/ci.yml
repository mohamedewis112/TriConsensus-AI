name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings httpx pytest pytest-asyncio pandas supabase "langgraph>=1.2.16,<2"

      - name: Run fail-closed tests
        env:
          PYTHONPATH: backend
        run: pytest -q
