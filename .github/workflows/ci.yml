name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install             "fastapi>=0.115,<1"             "pydantic>=2.10,<3"             "pydantic-settings>=2.7,<3"             "httpx>=0.28,<1"             "pytest>=8.3,<9"             "pytest-asyncio>=0.25,<2"             "numpy>=2.1,<3"             "pandas>=2.2,<4"             "supabase>=2.13,<3"             "langgraph>=1.2.16,<2"

      - name: Run fail-closed tests
        env:
          PYTHONPATH: backend
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build dashboard
        env:
          TRICONSENSUS_API_URL: http://127.0.0.1:8000
          TRICONSENSUS_API_KEY: ci-placeholder-never-used-at-build
        run: npm run build


  v5-cross-venue-final:
    if: github.ref == 'refs/heads/feat/v1-foundation' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: BTCUSDT
            days: 90
            end_date: "2024-11-30"
            window: "discovery"
          - symbol: BTCUSDT
            days: 90
            end_date: "2024-08-31"
            window: "replication"
          - symbol: ETHUSDT
            days: 90
            end_date: "2024-11-30"
            window: "discovery"
          - symbol: ETHUSDT
            days: 90
            end_date: "2024-08-31"
            window: "replication"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install V5 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.28,<1" "pydantic>=2.10,<3" "pydantic-settings>=2.7,<3" "numpy>=2.1,<3" "pandas>=2.2,<4"

      - name: Run final V5 cross-venue screen
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.cross_venue_evidence             --symbol "${{ matrix.symbol }}"             --days "${{ matrix.days }}"             --end-date "${{ matrix.end_date }}"             --output-dir "v5-ci/${{ matrix.window }}/${{ matrix.symbol }}"

      - uses: actions/upload-artifact@v4
        with:
          name: "v5-ci-${{ matrix.window }}-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "v5-ci/${{ matrix.window }}/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
