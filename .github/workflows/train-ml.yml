name: Train V1 ML Evidence

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days per symbol"
        required: true
        default: "45"
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "ml-trigger/run.txt"

permissions:
  contents: read

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve training days
        id: config
        shell: bash
        run: |
          DAYS="${{ inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS="45"; fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"

      - name: Install ML training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install             "httpx>=0.28,<1"             "pydantic>=2.10,<3"             "pydantic-settings>=2.7,<3"             "numpy>=2.1,<3"             "pandas>=2.2,<4"             "scikit-learn>=1.6,<2"             "lightgbm>=4.5,<5"             "xgboost>=3,<4"             "catboost>=1.2,<2"

      - name: Train and walk-forward validate
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.training             --symbol "${{ matrix.symbol }}"             --days "${{ steps.config.outputs.days }}"             --output-dir "artifacts/${{ matrix.symbol }}"

      - uses: actions/upload-artifact@v4
        with:
          name: "triconsensus-v1-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "artifacts/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
