name: V8.5 CHRONOS Alpha Immune CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_immune.py"
      - "tests/test_chronos_immune.py"
      - ".github/workflows/v85-chronos-immune-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_immune.py"
      - "tests/test_chronos_immune.py"

jobs:
  alpha-immune:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test alpha vaccination, immune memory and minimal repair
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_immune.py
