name: V8.26 CHRONOS Regime-Gated ETH Timing A-B

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "research-trigger/v826-regime-gated-ab.txt"
      - "backend/triconsensus/chronos_regime_gated_ab.py"
      - "tests/test_chronos_regime_gated_ab.py"
      - ".github/workflows/v826-chronos-regime-gated-ab.yml"

permissions:
  contents: read

jobs:
  regime-gated-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt "pytest>=8.3,<9"
      - name: Test exact regime gate
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_regime_gated_ab.py
      - name: Run exact-regime gate and A-B only on a real match
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_regime_gated_ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v826-regime-gated-ab
          path: artifacts/chronos-v826-regime-gated-ab.json
          if-no-files-found: ignore
          retention-days: 14
