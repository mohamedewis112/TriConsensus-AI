name: V8.23 CHRONOS WebSocket Stability Vault

on:
  workflow_dispatch:
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "research-trigger/v823-ws-stability.txt"
      - "backend/triconsensus/chronos_ws_nervous_system.py"
      - "backend/triconsensus/chronos_ws_challenger.py"
      - "backend/triconsensus/chronos_ws_stability.py"
      - "tests/test_chronos_ws_stability.py"
      - ".github/workflows/v823-chronos-ws-stability.yml"

permissions:
  contents: read

jobs:
  ws-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9" "websockets>=15,<16"
      - name: Test stability aggregation
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_ws_stability.py
      - name: Run four sequential live websocket evidence windows
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_ws_stability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v823-ws-stability
          path: artifacts/chronos-v823-ws-stability.json
          if-no-files-found: ignore
          retention-days: 14
