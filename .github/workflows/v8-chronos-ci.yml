name: V8 CHRONOS CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos.py"
      - "tests/test_chronos.py"
      - "docs/CHRONOS_V8.md"
      - ".github/workflows/v8-chronos-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos.py"
      - "tests/test_chronos.py"

jobs:
  chronos-research-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal CHRONOS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Compile CHRONOS
        env:
          PYTHONPATH: backend
        run: python -m py_compile backend/triconsensus/chronos.py
      - name: Run CHRONOS tests
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos.py
