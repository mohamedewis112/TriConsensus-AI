name: V8.21 CHRONOS WebSocket Execution Challenger

on:
  workflow_dispatch:
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "research-trigger/v821-ws-challenger.txt"
      - "backend/triconsensus/chronos_ws_nervous_system.py"
      - "backend/triconsensus/chronos_ws_challenger.py"
      - "tests/test_chronos_ws_challenger.py"
      - ".github/workflows/v821-chronos-ws-challenger.yml"

permissions:
  contents: read

jobs:
  ws-execution-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9" "websockets>=15,<16"
      - name: Test challenger model
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_ws_challenger.py
      - name: Collect 90s event-driven evidence and evaluate fast heads
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_ws_challenger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v821-ws-challenger
          path: artifacts/chronos-v821-ws-challenger.json
          if-no-files-found: ignore
          retention-days: 14
