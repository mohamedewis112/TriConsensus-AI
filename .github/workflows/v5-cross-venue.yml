name: V5 Cross Venue Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: BTCUSDT
            days: 90
            end_date: "2024-11-30"
            window: "discovery"
          - symbol: BTCUSDT
            days: 90
            end_date: "2024-08-31"
            window: "replication"
          - symbol: ETHUSDT
            days: 90
            end_date: "2024-11-30"
            window: "discovery"
          - symbol: ETHUSDT
            days: 90
            end_date: "2024-08-31"
            window: "replication"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V5 research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.28,<1" "pydantic>=2.10,<3" "pydantic-settings>=2.7,<3" "numpy>=2.1,<3" "pandas>=2.2,<4"
      - name: Run cross-venue evidence screen
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.cross_venue_evidence             --symbol "${{ matrix.symbol }}"             --days "${{ matrix.days }}"             --end-date "${{ matrix.end_date }}"             --output-dir "v5-cross/${{ matrix.window }}/${{ matrix.symbol }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "triconsensus-v5-cross-${{ matrix.window }}-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "v5-cross/${{ matrix.window }}/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
