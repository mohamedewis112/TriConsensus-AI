name: V8.26 Regime Monitor Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v826-regime-monitor-scheduler.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: v826-regime-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1-foundation
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal monitor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pandas>=2.2,<4" "httpx>=0.28,<1"

      - name: Run exact ETH regime gate and conditional A-B
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_regime_gated_ab

      - name: Collect prior V8.26 monitor evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/v826-history
          if [ -f artifacts/chronos-v826-regime-gated-ab.json ]; then
            cp artifacts/chronos-v826-regime-gated-ab.json artifacts/v826-history/current.json
          fi
          gh run list \
            --workflow "V8.26 Regime Monitor Scheduler" \
            --limit 100 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId' \
            | while read -r run_id; do
                [ -z "$run_id" ] && continue
                mkdir -p "artifacts/v826-history/${run_id}"
                gh run download "$run_id" \
                  --name chronos-v826-regime-monitor \
                  --dir "artifacts/v826-history/${run_id}" || true
              done

      - name: Build V8.27 independent match ledger
        if: always()
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.chronos_match_ledger \
            --input-dir artifacts/v826-history \
            --output artifacts/chronos-v827-match-ledger.json

      - name: Upload regime monitor and evidence ledger
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v826-regime-monitor
          path: |
            artifacts/chronos-v826-regime-gated-ab.json
            artifacts/chronos-v827-match-ledger.json
          if-no-files-found: ignore
          retention-days: 90

