name: V8.26 Regime Monitor Scheduler

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v826-regime-monitor-scheduler.yml"

permissions:
  contents: read

concurrency:
  group: v826-regime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1-foundation
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run exact ETH regime gate and conditional A-B
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_regime_gated_ab

      - name: Upload regime monitor artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v826-regime-monitor
          path: artifacts/chronos-v826-regime-gated-ab.json
          if-no-files-found: ignore
          retention-days: 14

