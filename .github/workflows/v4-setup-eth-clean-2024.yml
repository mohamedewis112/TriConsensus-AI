name: V4 Strict ETH Clean 2024

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eth-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.28,<1" "pydantic>=2.10,<3" "pydantic-settings>=2.7,<3" "numpy>=2.1,<3" "pandas>=2.2,<4"
      - name: Run strict clean ETH setup research
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.setup_research             --symbol ETHUSDT             --days 244             --end-date 2024-11-30             --output-dir "v4-strict-eth-clean-2024/ETHUSDT"
      - uses: actions/upload-artifact@v4
        with:
          name: "v4-strict-eth-clean-2024-${{ github.run_id }}"
          path: "v4-strict-eth-clean-2024/ETHUSDT"
          if-no-files-found: error
          retention-days: 30
