name: V4 Regime Discovery

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Completed Bybit archive days"
        required: true
        default: "90"
      end_date:
        description: "Archive end date (YYYY-MM-DD)"
        required: true
        default: "2026-08-11"

permissions:
  contents: read

jobs:
  discover:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install regime research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install             "httpx>=0.28,<1"             "pydantic>=2.10,<3"             "pydantic-settings>=2.7,<3"             "numpy>=2.1,<3"             "pandas>=2.2,<4"

      - name: Discover regime-specific edge
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.regime_research             --symbol "${{ matrix.symbol }}"             --days "${{ inputs.days }}"             --end-date "${{ inputs.end_date }}"             --output-dir "v4-regime/${{ matrix.symbol }}"

      - uses: actions/upload-artifact@v4
        with:
          name: "triconsensus-v4-regime-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "v4-regime/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
