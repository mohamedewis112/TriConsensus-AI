name: V8.12 CHRONOS Latent Actor CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_latent_actors.py"
      - "tests/test_chronos_latent_actors.py"
      - ".github/workflows/v812-chronos-latent-actor-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_latent_actors.py"
      - "tests/test_chronos_latent_actors.py"

jobs:
  latent-actors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test latent behavioral archetype discovery
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_latent_actors.py
