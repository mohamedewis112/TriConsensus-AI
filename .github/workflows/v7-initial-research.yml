name: V7 Initial Research

on:
  workflow_dispatch:
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "backend/triconsensus/v7_*.py"
      - "research/v7/V7-SIGNAL-LAB.md"
      - ".github/workflows/v7-initial-research.yml"

jobs:
  initial-development-window:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install V7 research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt "scikit-learn>=1.6,<2"

      - name: Run fixed 45-day V7 research window
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.v7_research \
            --symbol "${{ matrix.symbol }}" \
            --days 90 \
            --end-date 2026-10-20 \
            --output-dir "research-output/${{ matrix.symbol }}"

      - uses: actions/upload-artifact@v4
        with:
          name: "v7-initial-${{ matrix.symbol }}"
          path: "research-output/${{ matrix.symbol }}/v7-report.json"
          if-no-files-found: error
