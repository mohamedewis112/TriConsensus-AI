name: V8.6 CHRONOS Research Firewall CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_firewall.py"
      - "tests/test_chronos_firewall.py"
      - ".github/workflows/v86-chronos-firewall-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_firewall.py"
      - "tests/test_chronos_firewall.py"

jobs:
  research-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test PBO, deflated Sharpe and parameter plateau gates
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_firewall.py
