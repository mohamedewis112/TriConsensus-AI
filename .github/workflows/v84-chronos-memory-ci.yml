name: V8.4 CHRONOS Market Memory CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_memory.py"
      - "tests/test_chronos_memory.py"
      - ".github/workflows/v84-chronos-memory-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_memory.py"
      - "tests/test_chronos_memory.py"

jobs:
  market-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test causal market memory
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_memory.py
