name: V8.1 CHRONOS Learning CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_learning.py"
      - "backend/triconsensus/chronos_learning_smoke.py"
      - "tests/test_chronos_learning.py"
      - ".github/workflows/v81-chronos-learning-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_learning.py"
      - "tests/test_chronos_learning.py"

jobs:
  learned-world-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal learning dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test V8.1 learning layer
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_learning.py
      - name: Run chronological calibration smoke
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_learning_smoke
