name: V8.18 CHRONOS Multi-Window Evidence Vault CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_evidence_vault.py"
      - "tests/test_chronos_evidence_vault.py"
      - ".github/workflows/v818-chronos-evidence-vault-ci.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8.3,<9"
      - name: Test multi-window evidence aggregation
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_evidence_vault.py
