name: V8.10 CHRONOS Reality Ledger CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_reality_ledger.py"
      - "tests/test_chronos_reality_ledger.py"
      - ".github/workflows/v810-chronos-reality-ledger-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_reality_ledger.py"
      - "tests/test_chronos_reality_ledger.py"

jobs:
  reality-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test tamper-evident forecast ledger
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_reality_ledger.py
