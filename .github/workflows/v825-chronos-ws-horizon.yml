name: V8.25 CHRONOS WebSocket Horizon Lab

on:
  workflow_dispatch:
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "research-trigger/v825-ws-horizon.txt"
      - "backend/triconsensus/chronos_ws_nervous_system.py"
      - "backend/triconsensus/chronos_ws_challenger.py"
      - "backend/triconsensus/chronos_ws_stability.py"
      - "backend/triconsensus/chronos_ws_horizon_lab.py"
      - "tests/test_chronos_ws_horizon_lab.py"
      - ".github/workflows/v825-chronos-ws-horizon.yml"

permissions:
  contents: read

jobs:
  ws-horizon-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9" "websockets>=15,<16"
      - name: Freeze pre-registered horizon search
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_ws_horizon_lab.py
      - name: Run four live windows across four fixed horizons
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_ws_horizon_lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v825-ws-horizon-lab
          path: artifacts/chronos-v825-ws-horizon-lab.json
          if-no-files-found: ignore
          retention-days: 14
