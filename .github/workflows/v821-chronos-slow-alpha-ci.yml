name: V8.21 CHRONOS Slow Alpha Stability CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_slow_alpha.py"
      - "tests/test_chronos_slow_alpha.py"
      - ".github/workflows/v821-chronos-slow-alpha-ci.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-alpha-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test annual slow-alpha stability gate
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_slow_alpha.py
