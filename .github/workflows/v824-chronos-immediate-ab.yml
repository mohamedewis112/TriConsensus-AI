name: V8.24 CHRONOS Immediate ETH Timing A-B Smoke

on:
  workflow_dispatch:
  push:
    branches: ["feat/v1-foundation"]
    paths:
      - "research-trigger/v824-immediate-ab.txt"

permissions:
  contents: read

jobs:
  immediate-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt "pytest>=8.3,<9"
      - name: Test evaluator
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_immediate_ab.py
      - name: Run immediate live ETH timing A-B
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_immediate_ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-v824-immediate-ab
          path: artifacts/chronos-v824-immediate-ab.json
          if-no-files-found: ignore
          retention-days: 14
