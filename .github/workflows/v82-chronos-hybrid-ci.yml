name: V8.2 CHRONOS Hybrid World CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_hybrid.py"
      - "backend/triconsensus/chronos_hybrid_smoke.py"
      - "tests/test_chronos_hybrid.py"
      - ".github/workflows/v82-chronos-hybrid-ci.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-artificial-market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pytest>=8.3,<9"
      - name: Test hybrid world and fail-closed fallback
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_hybrid.py
      - name: Run learned 100K artificial-market smoke
        env:
          PYTHONPATH: backend
        run: python -m triconsensus.chronos_hybrid_smoke
