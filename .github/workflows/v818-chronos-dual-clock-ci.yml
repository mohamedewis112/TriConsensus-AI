name: V8.18 CHRONOS Dual Clock CI

on:
  push:
    branches: ["feat/**"]
    paths:
      - "backend/triconsensus/chronos_dual_clock.py"
      - "backend/triconsensus/chronos_learning.py"
      - "tests/test_chronos_dual_clock.py"
      - ".github/workflows/v818-chronos-dual-clock-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/triconsensus/chronos_dual_clock.py"
      - "backend/triconsensus/chronos_learning.py"
      - "tests/test_chronos_dual_clock.py"

jobs:
  dual-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pandas>=3.0,<4" "pytest>=8.3,<9"
      - name: Test head-specific trust and dual-clock authority split
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_chronos_dual_clock.py
