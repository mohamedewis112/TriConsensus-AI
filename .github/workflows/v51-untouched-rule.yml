name: V5.1 Untouched Directional Rule Gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research-trigger/v51-untouched-rule.txt"

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V5.1 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.28,<1" "pydantic>=2.10,<3" "pydantic-settings>=2.7,<3" "numpy>=2.1,<3" "pandas>=2.2,<4"
      - name: Run untouched directional rule gate
        env:
          PYTHONPATH: backend
        run: |
          python -m triconsensus.v51_rule_gate             --symbol "${{ matrix.symbol }}"             --calibration-days 180             --calibration-end-date 2024-11-30             --test-days 60             --test-end-date 2024-05-31             --output-dir "v51/${{ matrix.symbol }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "triconsensus-v51-${{ matrix.symbol }}-${{ github.run_id }}"
          path: "v51/${{ matrix.symbol }}"
          if-no-files-found: error
          retention-days: 30
